name: Android APK / AAB

# Builds the Capacitor wrapper. The APK loads the hosted site, so no web build
# artefacts are needed — publishing the web app is enough for content changes.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.1)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: bun run cap:sync

      # Persistent release signing: add repo secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Reusing the same keystore for every build lets new APKs install
      # straight over the previous one. Without the secrets the build falls
      # back to the debug key (sideload only, cannot upgrade a signed build).
      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELAY_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn when unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building with the debug key. Add the release keystore secrets for upgradable builds."

      - name: Resolve version
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$NAME" ] || [ "$NAME" = "main" ]; then NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "RELAY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          # Monotonically increasing so every build upgrades the last one.
          echo "RELAY_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        env:
          RELAY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Report signer
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: relay-media-android-${{ env.RELAY_VERSION_NAME }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
