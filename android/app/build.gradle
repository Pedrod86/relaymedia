apply plugin: 'com.android.application'

// Optional release signing. Create android/keystore.properties (never commit it):
//   storeFile=/absolute/path/relay-release.jks
//   storePassword=...
//   keyAlias=relay
//   keyPassword=...
// Environment variables (RELAY_STORE_FILE, RELAY_STORE_PASSWORD, RELAY_KEY_ALIAS,
// RELAY_KEY_PASSWORD) take precedence, which is what CI uses.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def storeFilePath = System.getenv('RELAY_STORE_FILE') ?: keystoreProps['storeFile']
def hasReleaseKey = storeFilePath != null && !storeFilePath.toString().isEmpty() && file(storeFilePath).exists()

android {
    namespace = "app.lovable.streamrelay"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lovable.streamrelay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv('RELAY_VERSION_CODE') ?: '1') as int
        versionName System.getenv('RELAY_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(storeFilePath)
                storePassword System.getenv('RELAY_STORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('RELAY_KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('RELAY_KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed with the release key when configured; otherwise the debug key so
            // `gradlew assembleRelease` still produces an installable APK for sideloading.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // AndroidX Media3 / ExoPlayer — native playback of MKV, Dolby Digital+ (E-AC3),
    // HEVC 10-bit HDR10 and Dolby Vision through the device decoders.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
